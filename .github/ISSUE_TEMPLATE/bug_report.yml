name: "🐛 Bug report"
description: "Something in Inari isn't working."
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Inari version
      description: "See Settings → About, or run `inari --version`."
      placeholder: "1.0.3"
    validations:
      required: true

  - type: input
    id: install
    attributes:
      label: How did you install it?
      placeholder: ".deb / one-line installer / AppImage / built from source"
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distro & desktop
      placeholder: "Fedora 42, KDE Plasma 6 (Wayland)"
    validations:
      required: true

  - type: input
    id: pipewire
    attributes:
      label: PipeWire / WirePlumber versions
      description: "`pipewire --version` and `wireplumber --version`"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Inari writes a rotating log file — please attach it, it covers the run
        the bug actually happened in:

        `~/.local/share/com.fbnlrz.inari/logs/inari.log`

        If Inari was started by its autostart unit, the same lines are also in
        `journalctl --user -u inari -n 200`.

        For more detail, quit Inari and rerun it from a terminal with
        `RUST_LOG=debug inari` — that raises the level for both the terminal
        output and the log file.
      render: shell
    validations:
      required: false
