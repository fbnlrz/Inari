name: Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate changelog from releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# Changelog"
            echo
            echo "Auto-generated from the [GitHub releases](https://github.com/${{ github.repository }}/releases)."
            echo
            gh api "repos/${{ github.repository }}/releases" --paginate \
              --jq '.[] | select(.draft|not) | "## \(.name // .tag_name)\n\n_\(.published_at[0:10])_ · [\(.tag_name)](\(.html_url))\n\n\(.body // "_No notes._")\n"'
          } > website/changelog.md || echo "changelog generation skipped"
      - name: Build the docs site
        working-directory: website
        run: |
          npm install
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
