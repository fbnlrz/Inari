name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)publish, e.g. 1.0.0. Leave blank to use the version in src-tauri/tauri.conf.json."
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: .

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            clang \
            squashfs-tools \
            zstd \
            jq

      - name: Determine release
        # The release version is whatever is in the manifest
        # (src-tauri/tauri.conf.json). A push to main auto-publishes it as a
        # stable vX.Y.Z the first time that version is seen (its tag doesn't
        # exist yet); pushes that don't bump the version are a no-op. A manual
        # dispatch re-publishes the current version (or an explicit override),
        # replacing an existing release of the same tag.
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          manifest=$(jq -r .version src-tauri/tauri.conf.json)
          ver="${INPUT_VERSION:-$manifest}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z (got '$ver')"; exit 1
          fi
          tag="v$ver"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release=true; force=true      # manual run: (re)publish this version
          elif git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already released - nothing to do"
            release=false; force=false    # version unchanged since last release
          else
            release=true; force=false     # new version on main -> auto-release
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"
          echo "Release decision: tag=$tag release=$release force=$force"

      - name: Stamp version into the build
        if: steps.ver.outputs.release == 'true'
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.version }}"
          jq --arg v "$ver" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          npm pkg set version="$ver"
          # Keep the crate version in step so CARGO_PKG_VERSION (crash reports,
          # --version, package metadata) matches the release instead of 0.1.0.
          sed -i '0,/^version = /{s/^version = .*/version = "'"$ver"'"/}' src-tauri/Cargo.toml

      - run: npm ci
        if: steps.ver.outputs.release == 'true'

      - name: Verify (never publish untested code)
        if: steps.ver.outputs.release == 'true'
        run: |
          npx tsc --noEmit
          npm test
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build bundles
        if: steps.ver.outputs.release == 'true'
        run: npm run tauri build

      - name: Repack AppImage against system PipeWire
        if: steps.ver.outputs.release == 'true'
        # Strip the bundled libpipewire so the loader uses the system one.
        run: |
          set -euo pipefail
          cd "$(dirname "$(find target -path '*/release/bundle/appimage/*.AppImage' | head -1)")"
          app=$(ls *.AppImage)
          ./"$app" --appimage-extract > /dev/null
          rm -fv squashfs-root/usr/lib/libpipewire-0.3.so*
          offset=$(./"$app" --appimage-offset)
          head -c "$offset" "$app" > runtime
          mksquashfs squashfs-root payload.squashfs -root-owned -noappend -quiet -comp zstd
          cat runtime payload.squashfs > "$app"
          chmod +x "$app"

      - name: Publish
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          # A manual re-run replaces an existing release of the same version.
          if [ "${{ steps.ver.outputs.force }}" = "true" ]; then
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Inari $tag" \
            --generate-notes --notes "Linux builds:
          - **AppImage** - portable, run anywhere (\`chmod +x\` and go)
          - **.deb** - Debian / Ubuntu and derivatives
          - **.rpm** - Fedora / openSUSE and derivatives

          Requires PipeWire with \`pipewire-pulse\` and WirePlumber 0.5+."
          # Checksums over everything this job builds, by basename, so users
          # can verify their downloads.
          ( cd target/release/bundle
            sha256sum appimage/*.AppImage deb/*.deb rpm/*.rpm \
              | awk '{ n=$2; sub(/.*\//, "", n); print $1"  "n }' \
              > "$GITHUB_WORKSPACE/SHA256SUMS" )
          gh release upload "$tag" --clobber \
            "$GITHUB_WORKSPACE/SHA256SUMS" \
            target/release/bundle/appimage/*.AppImage \
            target/release/bundle/deb/*.deb \
            target/release/bundle/rpm/*.rpm

      - name: Open the next dev branch
        # After releasing vX.Y.Z, open dev/X.Y.(Z+1) off the release commit with
        # the manifest already bumped to that next version, so simply merging the
        # branch back to main auto-releases it (no manual version bump needed).
        # Never touches an existing branch.
        if: steps.ver.outputs.release == 'true'
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.version }}"
          IFS=. read -r ma mi pa <<< "$ver"
          next="${ma}.${mi}.$((pa + 1))"
          branch="dev/${next}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::notice::$branch already exists - leaving it untouched"
            exit 0
          fi
          git checkout -b "$branch"
          # Bump the version everywhere it is declared.
          jq --arg v "$next" '.version = $v' src-tauri/tauri.conf.json > /tmp/conf.json
          mv /tmp/conf.json src-tauri/tauri.conf.json
          npm pkg set version="$next"
          sed -i '0,/^version = /{s/^version = .*/version = "'"$next"'"/}' src-tauri/Cargo.toml
          # Keep Cargo.lock's own package entry in sync so the branch builds clean.
          sed -i '/^name = "inari"$/{n;s/^version = .*/version = "'"$next"'"/}' Cargo.lock || true
          git config user.name "fbnlrz"
          git config user.email "137117973+fbnlrz@users.noreply.github.com"
          git add src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml Cargo.lock
          git commit -m "chore: begin $next development"
          git push origin "$branch"
          echo "::notice::opened $branch at version $next"
