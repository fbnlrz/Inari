[package]
name = "inari"
version = "1.0.10"
description = "Linux-native audio routing and mixing for PipeWire, with SteelSeries device control"
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-only"

[lib]
name = "inari_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
# Native open/save pickers for EQ preset import/export; the file I/O itself
# stays in our own commands (no fs plugin / scope surface needed).
tauri-plugin-dialog = "2"
# Single-instance guard: a second launch (KDE session-restore relaunching the
# app alongside our systemd autostart unit, or a double-click of the launcher)
# would otherwise spawn a duplicate that fights over the same virtual sinks.
# The plugin hands the launch to the running instance instead.
tauri-plugin-single-instance = "2"
# System-wide hotkeys (mute the mic while a game has focus). Nothing is bound
# out of the box - see `commands::hotkeys` for why, and for how a failed grab
# (the normal outcome under Wayland) is reported instead of swallowed.
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
# Direct /dev/hidraw access for the Arctis base station: libc for the
# HIDIOCSFEATURE ioctl (OLED feature reports); plain read/write covers the
# rest. No libhidapi/libusb system dependency.
libc = "0.2"
# Decode OLED media (still images + animated GIFs) to 1-bit frames. Video is
# handled out-of-process via the system ffmpeg, so no heavy codec deps here.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# Verify the downloaded .deb against the release's SHA256SUMS before handing it
# to `pkexec apt-get` - the one place we run attacker-reachable bytes as root.
sha2 = "0.10"
# Soundboard clips: WAV and FLAC decode in-process, because the two formats a
# user's own recordings actually arrive in must play on a machine without
# ffmpeg. Both crates are pure Rust parsers with no system dependency; the
# compressed formats (mp3, ogg, m4a) still go through the optional system
# ffmpeg, exactly like OLED video does.
hound = "3"
claxon = "0.4"
# 0.8.0 on crates.io predates PipeWire 1.6 headers (libspa bindgen breaks);
# git main carries the header fixes. v0_3_49 gates Buffer::requested().
pipewire = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs", rev = "v0.10.0", features = ["v0_3_49"] }
# Logging. Started from the app menu or the systemd autostart unit, stderr
# goes somewhere the user can't find - so everything also lands in a small
# rotating file under the app's log dir that a bug report can attach.
tauri-plugin-log = "2"
log = "0.4"
# Inari Remote: the LAN server that lets a tablet drive the mixer. axum is
# trimmed to what the remote actually needs - one HTTP/1 listener, one
# WebSocket, query strings. No JSON extractor: frames are parsed by hand so a
# malformed one is an error reply rather than a 422 with no request id.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "ws"] }
# The remote owns this runtime on its own thread; Tauri's async_runtime stays
# free for the commands that already use it.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
# Pairing QR as an SVG string, rendered in Rust so the token never reaches an
# npm package. `image` is off - we only ever emit the SVG.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# The remote token comes from the OS CSPRNG. Anything derived from the clock
# would be guessable by whoever else is on the Wi-Fi.
getrandom = "0.3"
# Constant-time token comparison, so a wrong token cannot be walked byte by
# byte from response timings.
subtle = "2"
# Request paths arrive percent-encoded; they are decoded before the traversal
# check so `%2e%2e` cannot slip past it.
percent-encoding = "2"
# The bind address is the user's choice, which means offering them the real
# addresses this machine has rather than a text field and a guess.
if-addrs = "0.15"
